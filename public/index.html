<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5fb" />
  <meta name="description" content="{{SEO_DESC}}" />
  <meta name="keywords" content="{{SEO_KEYWORDS}}" />
  <title>{{SEO_TITLE}}</title>
  <link rel="canonical" href="{{CANONICAL}}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{SITE_NAME}}" />
  <meta property="og:title" content="{{SEO_TITLE}}" />
  <meta property="og:description" content="{{SEO_DESC}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{SEO_TITLE}}" />
  <meta name="twitter:description" content="{{SEO_DESC}}" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/store.css" />
  <script>
    // 首屏主题，避免闪烁；默认浅色二次元主题
    (function () {
      try {
        var t = localStorage.getItem('fh-theme') || 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <div class="bg-shop" id="bgShop"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="bg-grain"></div>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="brand" id="brandLink">
        <span class="brand-mark" id="brandMark">S</span>
        <span class="brand-text">
          <strong id="brandName">Slogan</strong>
          <small>自动发货 · 即买即得</small>
        </span>
      </a>

      <nav class="main-nav" id="mainNav">
        <a href="/" data-nav="home">首页</a>
        <a href="/seckill" data-nav="seckill">限时秒杀</a>
        <a href="/orders" data-nav="orders">我的订单</a>
        <a href="/tickets" data-nav="tickets">工单中心</a>
      </nav>

      <div class="header-actions">
        <div class="mini-select" id="langWrap">
          <select id="langSel" aria-label="切换语言"><option value="zh-CN">简中</option><option value="zh-TW">繁中</option><option value="en">EN</option></select>
        </div>
        <div class="mini-select" id="curWrap">
          <select id="curSel" aria-label="切换货币"><option value="CNY">CNY</option><option value="USD">USD</option><option value="JPY">JPY</option></select>
        </div>
        <button class="icon-btn" id="themeToggle" title="切换深色模式" aria-label="切换主题"></button>
        <a class="icon-btn hide-sm" href="/orders" title="我的订单" aria-label="我的订单" id="orderIcon"></a>
        <button class="cart-btn" id="cartBtn" aria-label="购物车">
          <span class="cart-icon" id="cartIcon"></span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <div class="user-area" id="userArea"></div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="shop-layout">
      <aside class="shop-aside" id="shopAside">
        <div class="shop-card">
          <div class="shop-avatar" id="shopAvatar"><img src="/assets/img/avatar.webp" alt="店铺头像"></div>
          <h2 id="shopName">Slogan</h2>
          <p id="shopDesc">卡密自动发货 · 会员折扣 · 多支付渠道</p>
          <div class="shop-stats">
            <div><strong id="statProducts">0</strong><span>在售商品</span></div>
            <div><strong id="statOrders">0</strong><span>今日订单</span></div>
            <div><strong id="statSold">0</strong><span>累计销量</span></div>
          </div>
          <div class="shop-actions">
            <a class="btn btn-primary btn-sm" href="/orders">我的订单</a>
            <button class="btn btn-soft btn-sm" id="asideCart">购物车</button>
          </div>
        </div>
        <div class="shop-announce" id="asideAnnouncement" hidden>
          <div class="shop-announce-head">公告</div>
          <div id="asideAnnouncementText"></div>
        </div>
        <div class="shop-links" id="shopLinks"></div>
      </aside>

      <main id="app" class="shop-main">
        <div class="page-loading">
          <div class="spinner"></div>
          <p>正在加载…</p>
        </div>
      </main>
    </div>
  </div>

  <footer class="site-footer" id="siteFooter"></footer>

  <!-- 购物车抽屉 -->
  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="购物车">
    <div class="drawer-head">
      <h3>购物车</h3>
      <button class="icon-btn" id="drawerClose" aria-label="关闭"></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </aside>

  <nav class="mobile-tabbar" id="mobileTabbar">
    <a href="/" data-nav="home"><i id="tbHome"></i><span>首页</span></a>
    <a href="/seckill" data-nav="seckill"><i id="tbSeckill"></i><span>秒杀</span></a>
    <a href="/orders" data-nav="orders"><i id="tbOrders"></i><span>订单</span></a>
    <a href="/tickets" data-nav="tickets"><i id="tbTickets"></i><span>工单</span></a>
    <a href="/account" data-nav="account"><i id="tbAccount"></i><span>我的</span></a>
  </nav>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toast-root" id="toastRoot"></div>

  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/store.js"></script>
</body>
</html>
